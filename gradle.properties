# JVM settings tuned for a small build host. The Kotlin compiler runs in-process
# so only one JVM is alive at a time.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=false

kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768m
kotlin.code.style=official
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
