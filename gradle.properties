# JVM settings tuned for a small build host. The Kotlin compiler runs in-process
# so only one JVM is alive at a time.
#
# The metaspace ceiling is 640m, not 320m. This module's Compose + KSP + Room
# round needs more than 320m of class metadata, and Gradle reacts to running out
# by retiring the daemon after the build — so every subsequent build paid for a
# fresh daemon, a re-run of KSP and a cold JIT on the tasks that dominate a build
# here. The compressed class space is pinned to 256m because the JVM's 1 GB
# default reservation is more address space than a small host will give it, and
# the build then dies with "Could not allocate compressed class space" before it
# starts. G1 rather than SerialGC: the compiler and R8 allocate hard enough that
# a stop-the-world collector of that size spent more time collecting than
# compiling.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=640m -XX:CompressedClassSpaceSize=256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=false

kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768m
kotlin.code.style=official
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
