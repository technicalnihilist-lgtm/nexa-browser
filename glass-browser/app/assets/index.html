<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Browser</title>
<style>
:root{box-sizing:border-box;--b1:#bcd8ff;--b2:#f0cfff;--b3:#ffe2c4;--tx:#111118;--tx2:#5d5d6b;--gl:rgba(255,255,255,.42);--gb:rgba(255,255,255,.75);--sh:rgba(40,50,110,.22);--ac:#0a84ff;--cd:rgba(255,255,255,.5);--bg:#e8eefc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#10224d;--b2:#31154f;--b3:#12363f;--tx:#f5f5fa;--tx2:#a4a4b4;--gl:rgba(38,38,52,.45);--gb:rgba(255,255,255,.2);--sh:rgba(0,0,0,.55);--cd:rgba(70,70,90,.5);--bg:#0b0d1a}}
:root[data-theme="dark"]{--b1:#10224d;--b2:#31154f;--b3:#12363f;--tx:#f5f5fa;--tx2:#a4a4b4;--gl:rgba(38,38,52,.45);--gb:rgba(255,255,255,.2);--sh:rgba(0,0,0,.55);--cd:rgba(70,70,90,.5);--bg:#0b0d1a}
body.priv{--b1:#2a1450;--b2:#10102a;--b3:#3a1646;--gl:rgba(50,30,80,.5);--bg:#150c2a;--tx:#f5f0ff;--tx2:#b7a9d6;--cd:rgba(90,60,130,.5)}
html,body{height:100%;margin:0;overflow:hidden;background:transparent}
body{color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;transition:color .3s}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer}
#wall{position:fixed;inset:0;background:radial-gradient(60% 40% at 20% 15%,var(--b1),transparent 70%),radial-gradient(55% 45% at 85% 30%,var(--b2),transparent 70%),radial-gradient(70% 50% at 50% 95%,var(--b3),transparent 70%),var(--bg);transition:.5s,opacity .35s}
body.page #wall{opacity:0}
.glass{position:relative;background:var(--gl);backdrop-filter:blur(24px) saturate(190%);-webkit-backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--gb);box-shadow:0 10px 34px var(--sh),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 18px rgba(255,255,255,.08)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12))}
#main{position:fixed;left:0;right:0;top:0;bottom:0}
#home{height:100%;overflow:auto;padding:22px 18px 190px;box-sizing:border-box;-webkit-overflow-scrolling:touch}
#clock{text-align:center;margin:10px 0 18px}#clock b{display:block;font-size:64px;font-weight:200;letter-spacing:-2px}#clock span{color:var(--tx2)}
#hs{display:flex;align-items:center;gap:10px;height:52px;border-radius:26px;padding:0 18px;margin-bottom:24px}#hs input{flex:1;background:none;border:0;outline:0;min-width:0}
h3{margin:22px 4px 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);display:flex;justify-content:space-between;align-items:center}
h3 button{color:var(--ac);text-transform:none;letter-spacing:0;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;transition:transform .2s}.tile:active{transform:scale(.9)}
.tile i{width:60px;height:60px;border-radius:17px;display:grid;place-items:center;font:600 26px -apple-system,sans-serif;font-style:normal;color:#fff;box-shadow:0 6px 16px var(--sh),inset 0 1px 0 rgba(255,255,255,.5)}
.tile span{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .x{display:none;position:absolute;top:-6px;right:4px;width:22px;height:22px;border-radius:11px;background:#ff453a;color:#fff;font-size:15px;line-height:22px;text-align:center}
.edit .tile .x{display:block}
.list{border-radius:20px;overflow:hidden}.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--gb)}.row:last-child{border:0}
.row i{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:600}.row div{flex:1;min-width:0}.row small{display:block;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rm{color:var(--tx2);padding:6px;flex:none}
#err{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:30px;gap:10px;background:var(--bg)}
#err[hidden]{display:none!important}
#err h2{margin:0}#err p{color:var(--tx2);margin:0}
#bar{position:fixed;left:10px;right:10px;bottom:8px;border-radius:32px;padding:8px 10px 4px;z-index:5;transition:background .3s,transform .3s,opacity .2s}
body.hidebar #bar{opacity:0;transform:translateY(26px);pointer-events:none}
#bar.sc{--gl:rgba(255,255,255,.62)}body.priv #bar.sc,:root[data-theme="dark"] #bar.sc{--gl:rgba(30,30,44,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #bar.sc{--gl:rgba(30,30,44,.7)}}
#pill{display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;padding:0 6px 0 14px;background:var(--cd);border:1px solid var(--gb);box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
#url{flex:1;min-width:0;background:none;border:0;outline:0;text-align:center;font-size:16px}#url:focus{text-align:left}
#pill .ic{width:30px;height:30px;display:grid;place-items:center;border-radius:15px;flex:none}
#tb{display:flex;justify-content:space-around;padding-top:2px}#tb button{width:48px;height:42px;display:grid;place-items:center;border-radius:21px;position:relative;transition:transform .15s,background .2s}
#tb button:active,#pill .ic:active{transform:scale(.82);background:var(--cd)}#tb button:disabled{opacity:.3}
svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cnt{position:absolute;font:700 10px sans-serif;top:14px}
#prog{position:fixed;left:18px;right:18px;bottom:114px;height:3px;border-radius:2px;z-index:6;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .3s}
#prog i{display:block;height:100%;width:0;background:var(--ac);border-radius:2px}
#sug{position:fixed;left:10px;right:10px;bottom:120px;border-radius:24px;z-index:4;max-height:52vh;overflow:auto;display:none}
#sug .chips{display:flex;gap:8px;padding:10px 12px 4px}.chip{padding:6px 14px;border-radius:16px;background:var(--cd);font-size:14px}
#scrim2{position:fixed;inset:0;z-index:3;display:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.3s;z-index:8}#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:8px;right:8px;bottom:8px;max-height:80vh;overflow:auto;border-radius:34px;padding:18px 14px 16px;z-index:9;transform:translateY(120%);transition:transform .45s cubic-bezier(.2,.9,.25,1);box-sizing:border-box}#sheet.on{transform:none}
#sheet h2{margin:0 6px 12px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;padding:3px;border-radius:14px;background:var(--cd);margin-bottom:12px}.seg button{flex:1;padding:7px;border-radius:11px;font-size:14px}.seg .on{background:var(--gb);box-shadow:0 2px 6px var(--sh)}
.btn{display:block;width:100%;padding:13px;border-radius:16px;background:var(--cd);text-align:center;margin-top:8px}.btn.red{color:#ff453a}.btn.pri{background:var(--ac);color:#fff}
.fld{display:flex;justify-content:space-between;align-items:center;padding:10px 6px;gap:10px}.fld input[type=text],.fld select,.fld input:not([type]){background:var(--cd);border:1px solid var(--gb);border-radius:12px;padding:8px 10px;min-width:0;max-width:60%}
.note{color:var(--tx2);font-size:13px;margin:6px;}
#tabsv{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;background:var(--gl);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}#tabsv.on{display:flex;animation:fi .3s}
#tg{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;align-content:start}
.card{position:relative;border-radius:24px;overflow:hidden;animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both;transition:transform .3s,opacity .3s}.card.out{transform:scale(.6) translateY(30px);opacity:0}
.card.act{outline:3px solid var(--ac)}.card .pv{height:150px;display:grid;place-items:center;font-size:44px;color:#fff;font-weight:600}.card .cp{padding:8px 36px 10px 12px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cl{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:14px;background:var(--cd);display:grid;place-items:center}
#tt{display:flex;justify-content:space-between;padding:12px 18px 14px;align-items:center;gap:10px}#tt .seg{margin:0;flex:1;max-width:220px}#tt button.b{padding:10px 18px;border-radius:20px}
#toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,40px);padding:10px 18px;border-radius:22px;z-index:20;transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .4s;font-size:14px;opacity:0;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}#toast.on{transform:translate(-50%,0);opacity:1}
@keyframes pop{from{transform:scale(.7);opacity:0}}@keyframes fi{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<div id="wall"></div>
<div id="main">
  <section id="home"></section>
  <div id="err" hidden></div>
</div>
<div id="prog"><i></i></div>
<div id="scrim2"></div>
<div id="sug" class="glass"></div>
<nav id="bar" class="glass" aria-label="Browser toolbar">
  <div id="pill"><span id="lock" class="ic"></span><input id="url" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search or enter website" aria-label="Address"><button id="clr" class="ic" aria-label="Clear" hidden></button><button id="rl" class="ic" aria-label="Reload"></button></div>
  <div id="tb"><button id="bk" aria-label="Back"></button><button id="fw" aria-label="Forward"></button><button id="shot" aria-label="Take screenshot"></button><button id="sh" aria-label="Share"></button><button id="bm" aria-label="Bookmarks and history"></button><button id="tabs" aria-label="Tabs"></button></div>
</nav>
<div id="tabsv"><div id="tg"></div><div id="tt" class="glass"><button class="b" id="tnew" aria-label="New tab"></button><div class="seg" id="tmode"><button data-m="0">Tabs</button><button data-m="1">Private</button></div><button class="b" id="tdone" style="color:var(--ac);font-weight:600">Done</button></div></div>
<div id="scrim"></div><div id="sheet" class="glass" role="dialog"></div>
<div id="toast" class="glass" role="status"></div>
<script>
var BR=window.Android||null,ISAPP=!!BR;
const $=s=>document.querySelector(s),ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={back:'M15 5l-7 7 7 7',fwd:'M9 5l7 7-7 7',share:'M12 15V3M8 7l4-4 4 4M6 11H5v10h14V11h-1',book:'M5 4a1 1 0 011-1h12a1 1 0 011 1v17l-7-5-7 5z',rl:'M20 12a8 8 0 11-2.4-5.7M20 4v5h-5',x:'M6 6l12 12M18 6L6 18',lock:'M7 11V8a5 5 0 0110 0v3M5 11h14v10H5z',plus:'M12 5v14M5 12h14',tabs:'M4 6h16v12H4z',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',warn:'M12 3l10 18H2zM12 10v5M12 18v.1',cam:'M3 9h3.4L8.2 6h7.6L17.6 9H21v10.5H3zM12 17.2a3.1 3.1 0 100-6.2 3.1 3.1 0 000 6.2z',ext:'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6'};
const ic=(n,s)=>`<svg viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}><path d="${P[n]}"/></svg>`;
const E={ddg:['DuckDuckGo','https://duckduckgo.com/?q='],g:['Google','https://www.google.com/search?q='],b:['Bing','https://www.bing.com/search?q='],e:['Ecosia','https://www.ecosia.org/search?q='],w:['Wikipedia','https://en.wikipedia.org/w/index.php?search=']};
const DF=[['Wikipedia','https://en.wikipedia.org'],['DuckDuckGo','https://duckduckgo.com'],['OpenStreetMap','https://www.openstreetmap.org'],['MDN','https://developer.mozilla.org'],['Hacker News','https://news.ycombinator.com'],['Archive','https://archive.org'],['Wikimedia','https://commons.wikimedia.org']].map(a=>({n:a[0],u:a[1]}));
let set=Object.assign({theme:'system',engine:'ddg',home:'',popups:true,noref:true},ld('lb.set',{}));
let bm=ld('lb.bm',[]),hist=ld('lb.hist',[]),fav=ld('lb.fav',DF),uid=Date.now();
let tabs=ld('lb.tabs',[]),curId=ld('lb.cur',0),mode=0,loading=false,editFav=false,sugOpen=false,lastChrome=-99,lastNavAt=0;
const mk=priv=>({id:++uid,priv:!!priv,stack:[],i:-1});
if(!tabs.length)tabs=[mk()];
const T=()=>{let t=tabs.find(x=>x.id===curId);if(!t){if(!tabs.length)tabs.push(mk());t=tabs[0];curId=t.id}return t};
function switchTo(t){if(!t)return;curId=t.id;if(BR)BR.show(String(t.id),t.stack[t.i]||'');render()}
function recoverTab(){const t=T();if(BR)BR.show(String(t.id),t.stack[t.i]||'')}
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u||''}};
const hue=u=>{let h=0;for(const c of host(u))h=(h*31+c.charCodeAt(0))%360;return h};
const tile=(n,u)=>`<i style="background:linear-gradient(145deg,hsl(${hue(u)} 80% 62%),hsl(${(hue(u)+35)%360} 70% 45%))">${esc(((n||host(u))||'?')[0].toUpperCase())}</i>`;
let saveT=0;
const saveNow=()=>{sv('lb.tabs',tabs.filter(t=>!t.priv));sv('lb.cur',curId);sv('lb.set',set);sv('lb.bm',bm);sv('lb.hist',hist);sv('lb.fav',fav)};
const save=()=>{clearTimeout(saveT);saveT=setTimeout(saveNow,400)};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2000)}
function theme(){const r=document.documentElement;set.theme==='system'?r.removeAttribute('data-theme'):r.dataset.theme=set.theme}
function norm(s){s=String(s||'').trim();if(!s)return null;if(/^(javascript|data|file|blob|about|intent):/i.test(s))return 'ERR';
 if(/^https?:\/\//i.test(s)){try{new URL(s);return s}catch(e){return 'ERR'}}
 if(!/\s/.test(s)&&(/^([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?([\/?#].*)?$/i.test(s)||/^localhost(:\d+)?([\/?#].*)?$/i.test(s)))return 'https://'+s;
 return E[set.engine][1]+encodeURIComponent(s)}

/* ---------- chrome sizing ---------- */
function overlayOpen(){return !$('#home').hidden||$('#tabsv').classList.contains('on')||$('#sheet').classList.contains('on')||!$('#err').hidden||sugOpen}
function syncChrome(){
  const h=overlayOpen()?-1:Math.ceil($('#bar').getBoundingClientRect().height)+16;
  if(h!==lastChrome){lastChrome=h;if(BR)BR.setChrome(h)}
}

/* ---------- navigation ---------- */
function go(s){const u=norm(s);if(!u)return;if(u==='ERR'){toast('That address can’t be opened');return}nav(u)}
function nav(u){const t=T();t.stack=t.stack.slice(0,t.i+1);t.stack.push(u);t.i++;
 if(!t.priv){hist.unshift({u,t:host(u),ts:Date.now()});hist=hist.slice(0,400)}
 lastNavAt=Date.now();save();if(BR)BR.nav(String(t.id),u);render()}
function sameish(a,b){try{const A=new URL(a),B=new URL(b);
 return A.host.replace(/^www\./,'')===B.host.replace(/^www\./,'')&&A.pathname.replace(/\/$/,'')===B.pathname.replace(/\/$/,'')&&A.search===B.search}catch(e){return false}}
function pushUrl(u,userPush){const t=T(),top=t.stack[t.i]||'';
 if(top===u)return;
 if(!userPush&&top&&sameish(top,u)){t.stack[t.i]=u;save();render();return}
 t.stack=t.stack.slice(0,t.i+1);t.stack.push(u);t.i++;
 if(!t.priv){hist.unshift({u,t:host(u),ts:Date.now()});hist=hist.slice(0,400)}save();render()}
function showErr(h,p){$('#home').hidden=true;$('#err').hidden=false;const e=$('#err');e.innerHTML=`<div style="color:var(--tx2);justify-self:center">${ic('warn',46)}</div><h2>${esc(h)}</h2><p>${esc(p)}</p><button class="btn pri" id="retry">Try again</button>`;$('#retry').onclick=()=>{const t=T();const u=t.stack[t.i];$('#err').hidden=true;if(u&&BR)BR.nav(String(t.id),u);render()};finish();syncChrome()}
function startLoad(){loading=true;$('#rl').innerHTML=ic('x',18);const p=$('#prog');p.style.opacity=1;const b=p.firstElementChild;b.style.transition='none';b.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transition='width 6s cubic-bezier(.1,.8,.2,1)';b.style.width='85%'}))}
function setProg(v){const p=$('#prog'),b=p.firstElementChild;if(v>=100)return;b.style.transition='width .2s';b.style.width=Math.max(8,v)+'%';p.style.opacity=1}
function finish(){loading=false;$('#rl').innerHTML=ic('rl',18);const p=$('#prog'),b=p.firstElementChild;b.style.transition='width .25s';b.style.width='100%';setTimeout(()=>{if(!loading)p.style.opacity=0},350)}

function render(){const t=T(),u=t.stack[t.i]||'';
 document.body.classList.toggle('priv',t.priv);
 document.body.classList.toggle('page',!!u);
 if(!u){$('#home').hidden=false;$('#err').hidden=true;$('#url').value=''}
 else{$('#home').hidden=true;$('#url').value=host(u)}
 $('#lock').innerHTML=u?ic(u.indexOf('https:')===0?'lock':'warn',17):ic('search',17);
 $('#lock').style.color=u&&u.indexOf('https:')!==0?'#ff9f0a':'var(--tx2)';
 $('#bk').disabled=!(t.i>0);$('#fw').disabled=!(t.i<t.stack.length-1);
 $('#tabs').innerHTML=ic('tabs')+`<span class="cnt">${tabs.filter(x=>x.priv===t.priv).length}</span>`;
 $('#clr').hidden=true;
 if(!u)home();
 syncChrome()}

function home(){const d=new Date(),h=$('#home');
 const rec=[...new Map(hist.map(x=>[x.t,x])).values()].slice(0,5),cnt={};hist.forEach(x=>cnt[x.t]=(cnt[x.t]||0)+1);
 const fq=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>hist.find(x=>x.t===e[0]));
 const row=x=>`<button class="row" data-u="${esc(x.u)}">${tile(x.t,x.u)}<div><div class="t">${esc(x.t)}</div><small>${esc(x.u)}</small></div></button>`;
 h.innerHTML=`<div id="clock"><b>${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</b><span>${d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</span></div>
 <div id="hs" class="glass">${ic('search',18)}<input id="hin" placeholder="Search or enter website" aria-label="Search" enterkeyhint="go"></div>
 <h3>Favorites <button id="fed">${editFav?'Done':'Edit'}</button></h3><div class="grid ${editFav?'edit':''}">${fav.map((f,i)=>`<button class="tile" data-u="${esc(f.u)}">${tile(f.n,f.u)}<span>${esc(f.n)}</span><b class="x" data-rf="${i}">×</b></button>`).join('')}<button class="tile" id="fadd"><i class="glass" style="color:var(--tx)">${ic('plus')}</i><span>Add</span></button></div>
 ${fq.length?`<h3>Frequently visited</h3><div class="list glass">${fq.map(row).join('')}</div>`:''}
 ${rec.length?`<h3>Recently visited</h3><div class="list glass">${rec.map(row).join('')}</div>`:''}
 <p class="note" style="text-align:center;margin-top:26px">Private tabs aren’t saved to history.</p>`;
 $('#hin').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();go(e.target.value)}};
 $('#fed').onclick=()=>{editFav=!editFav;home()};$('#fadd').onclick=addFav;
 h.onscroll=()=>$('#bar').classList.toggle('sc',h.scrollTop>10)}

function addFav(){sheet(`<h2>Add favorite</h2><div class="fld">Name<input id="fn" placeholder="Site name"></div><div class="fld">Address<input id="fu" placeholder="example.com" inputmode="url"></div><button class="btn pri" id="fok">Add</button>`);
 $('#fok').onclick=()=>{const u=norm($('#fu').value);if(!u||u==='ERR'||u.indexOf(E[set.engine][1])===0){toast('Enter a valid website address');return}fav.push({n:$('#fn').value.trim()||host(u),u});save();closeSheet();home()}}

document.addEventListener('click',e=>{const x=e.target.closest('[data-rf]');if(x){e.stopPropagation();e.preventDefault();fav.splice(+x.dataset.rf,1);save();home();return}
 const a=e.target.closest('[data-u]');if(a&&!editFav){closeSheet();hideSug();nav(a.dataset.u)}});

/* toolbar */
$('#bk').innerHTML=ic('back');$('#fw').innerHTML=ic('fwd');$('#sh').innerHTML=ic('share');$('#bm').innerHTML=ic('book');$('#clr').innerHTML=ic('x',14);$('#tnew').innerHTML=ic('plus');$('#shot').innerHTML=ic('cam',21);$('#rl').innerHTML=ic('rl',18);
$('#bk').onclick=()=>{const t=T();if(t.i>0){t.i--;if(BR)BR.nav(String(t.id),t.stack[t.i]);render()}};
$('#fw').onclick=()=>{const t=T();if(t.i<t.stack.length-1){t.i++;if(BR)BR.nav(String(t.id),t.stack[t.i]);render()}};
$('#rl').onclick=()=>{if(loading){if(BR)BR.stop(String(T().id));finish();toast('Stopped');return}const t=T(),u=t.stack[t.i];if(u){if(BR)BR.reload(String(t.id))}else if(BR)BR.blank(String(t.id));render()};
$('#shot').onclick=()=>{if(!BR){toast('Screenshots need the app');return}toast('Capturing…');BR.screenshot()};
$('#sh').onclick=async()=>{const u=T().stack[T().i];if(!u){toast('Nothing to share yet');return}
 if(BR){BR.share(u);return}
 try{if(navigator.share){await navigator.share({url:u,title:host(u)});return}}catch(e){if(e.name==='AbortError')return}copy(u)};
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Link copied')}catch(e){toast('Copy isn’t available here')}}
$('#bm').onclick=()=>lib('bm');

/* address bar */
const url=$('#url');
function showSug(){$('#scrim2').style.display='block';sugOpen=true;syncChrome();sugg()}
function hideSug(){if(!sugOpen)return;sugOpen=false;$('#sug').style.display='none';$('#scrim2').style.display='none';syncChrome()}
url.onfocus=()=>{const u=T().stack[T().i];url.value=u||'';setTimeout(()=>url.select(),0);showSug()};
url.onblur=()=>setTimeout(()=>{hideSug();const u=T().stack[T().i];url.value=u?host(u):''},180);
url.oninput=()=>{$('#clr').hidden=!url.value;sugg()};
url.onkeydown=e=>{if(e.key==='Enter'){const v=url.value;url.blur();go(v)}};
$('#clr').onmousedown=e=>{e.preventDefault();url.value='';$('#clr').hidden=true;sugg()};
$('#scrim2').onmousedown=e=>{e.preventDefault();url.blur();hideSug()};
function sugg(){const q=url.value.trim().toLowerCase(),s=$('#sug'),items=[];
 if(q){const seen=new Set();[...bm.map(b=>({u:b.u,t:b.t})),...hist].forEach(x=>{if(items.length<4&&!seen.has(x.u)&&(x.u.toLowerCase().includes(q)||(x.t||'').toLowerCase().includes(q))){seen.add(x.u);items.push(x)}})}
 let h=`<div class="chips"><button class="chip" id="cpy">Copy link</button><button class="chip" id="pst">Paste &amp; Go</button></div>`;
 if(q)h+=`<button class="row" data-u="${esc(norm(url.value)||'')}"><span style="width:24px">${ic('search',18)}</span><div><div class="t">${esc(url.value.trim())}</div><small>${/^(https?:\/\/|[^\s]+\.[a-z]{2,})/i.test(q)?'Go to website':'Search with '+E[set.engine][0]}</small></div></button>`;
 h+=items.map(x=>`<button class="row" data-u="${esc(x.u)}">${tile(x.t,x.u).replace('<i style="','<i style="width:28px;height:28px;font-size:14px;')}<div><div class="t">${esc(x.t||host(x.u))}</div><small>${esc(x.u)}</small></div></button>`).join('');
 s.innerHTML=h;s.style.display='block';
 $('#cpy').onmousedown=e=>{e.preventDefault();copy(T().stack[T().i]||url.value)};
 $('#pst').onmousedown=async e=>{e.preventDefault();try{const t=await navigator.clipboard.readText();url.blur();go(t)}catch(x){toast('Paste isn’t available here')}}}
$('#sug').addEventListener('mousedown',e=>e.preventDefault());

/* tabs */
$('#tabs').onclick=()=>{mode=T().priv?1:0;tabsView();$('#tabsv').classList.add('on');document.body.classList.add('hidebar');syncChrome()};
$('#tdone').onclick=()=>{$('#tabsv').classList.remove('on');document.body.classList.remove('hidebar');if(T().priv!==!!mode){const t=tabs.find(x=>x.priv===!!mode);if(t)switchTo(t)}render()};
$('#tnew').onclick=()=>{const t=mk(mode);tabs.push(t);curId=t.id;$('#tabsv').classList.remove('on');document.body.classList.remove('hidebar');if(BR)BR.newTab(String(t.id),'');render();save()};
$('#tmode').onclick=e=>{const b=e.target.closest('[data-m]');if(b){mode=+b.dataset.m;tabsView()}};
function tabsView(){document.body.classList.toggle('priv',!!mode);document.querySelectorAll('#tmode button').forEach(b=>b.classList.toggle('on',+b.dataset.m===mode));
 const L=tabs.filter(t=>t.priv===!!mode);$('#tg').innerHTML=L.length?L.map((t,i)=>{const u=t.stack[t.i];return `<div class="card glass ${t.id===curId?'act':''}" data-id="${t.id}" style="animation-delay:${i*40}ms"><div class="pv" style="background:${u?`linear-gradient(145deg,hsl(${hue(u)} 70% 60%),hsl(${(hue(u)+40)%360} 65% 42%))`:'linear-gradient(145deg,var(--b1),var(--b2))'}">${u?esc(host(u)[0].toUpperCase()):ic('search',40)}</div><div class="cp">${u?esc(host(u)):'Start Page'}</div><button class="cl" data-cl="${t.id}" aria-label="Close tab">${ic('x',14)}</button></div>`}).join(''):`<p class="note" style="grid-column:1/-1;text-align:center">${mode?'No private tabs. Tap + to start one.':'No tabs open.'}</p>`;syncChrome()}
$('#tg').onclick=e=>{const c=e.target.closest('[data-cl]');
 if(c){const id=+c.dataset.cl,card=c.closest('.card');card.classList.add('out');setTimeout(()=>{if(BR)BR.close(String(id));tabs=tabs.filter(t=>t.id!==id);
  if(!tabs.length){tabs.push(mk())}else if(!tabs.some(t=>t.priv===!!mode)&&!mode){tabs.push(mk())}
  if(!tabs.some(t=>t.id===curId)){const n=tabs.find(t=>t.priv===!!mode)||tabs[0];curId=n.id;if(BR)BR.show(String(n.id),n.stack[n.i]||'')}
  save();tabsView();render()},280);return}
 const k=e.target.closest('.card');if(k){curId=+k.dataset.id;$('#tabsv').classList.remove('on');document.body.classList.remove('hidebar');const t=tabs.find(x=>x.id===curId);if(t)switchTo(t);render();save()}};

/* sheets */
function sheet(h){$('#sheet').innerHTML=h;$('#sheet').classList.add('on');$('#scrim').classList.add('on');document.body.classList.add('hidebar');syncChrome()}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');document.body.classList.remove('hidebar');syncChrome()}
$('#scrim').onclick=closeSheet;
function lib(tab){const cur=T().stack[T().i],isB=cur&&bm.some(b=>b.u===cur);
 const row=(x,k,i)=>`<div class="row"><button style="display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left" data-u="${esc(x.u)}">${tile(x.t,x.u)}<div><div class="t">${esc(x.t||host(x.u))}</div><small>${esc(x.u)}</small></div></button><button class="rm" data-rm="${k}${i}" aria-label="Remove">${ic('x',16)}</button></div>`;
 const list=tab==='bm'?bm:hist.slice(0,60);
 sheet(`<h2>Library <button id="gear" style="font-size:15px;color:var(--ac)">Settings</button></h2><div class="seg"><button data-lt="bm" class="${tab==='bm'?'on':''}">Bookmarks</button><button data-lt="h" class="${tab==='h'?'on':''}">History</button></div>
 ${tab==='bm'?`<button class="btn" id="addbm" ${cur?'':'disabled'}>${isB?'Remove bookmark for this page':'Bookmark this page'}</button>`:`<button class="btn red" id="clh">Clear history</button>`}
 ${cur?`<button class="btn" id="extb">Open in system browser</button>`:''}
 <div class="list" style="margin-top:10px;background:var(--cd)">${list.length?list.map((x,i)=>row(x,tab==='bm'?'b':'h',i)).join(''):'<p class="note" style="text-align:center">Nothing here yet.</p>'}</div>`);
 document.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>lib(b.dataset.lt));$('#gear').onclick=settings;
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.dataset.rm[0],i=+b.dataset.rm.slice(1);k==='b'?bm.splice(i,1):hist.splice(i,1);save();lib(tab)});
 if($('#addbm'))$('#addbm').onclick=()=>{if(isB)bm=bm.filter(b=>b.u!==cur);else bm.unshift({u:cur,t:host(cur)});save();lib('bm')};
 if($('#extb'))$('#extb').onclick=()=>{closeSheet();if(BR)BR.openExternal(cur)};
 if($('#clh'))$('#clh').onclick=()=>{hist=[];save();lib('h')}}
function settings(){sheet(`<h2>Settings <button id="sdone" style="font-size:15px;color:var(--ac)">Done</button></h2>
 <div class="seg" id="th">${['system','light','dark'].map(m=>`<button data-th="${m}" class="${set.theme===m?'on':''}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
 <div class="fld">Search engine<select id="eng">${Object.entries(E).map(([k,v])=>`<option value="${k}" ${set.engine===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>
 <div class="fld">Homepage<input id="hp" value="${esc(set.home)}" placeholder="Start page" inputmode="url"></div>
 <div class="fld">Allow pop-ups<input type="checkbox" id="pop" ${set.popups?'checked':''}></div>
 <div class="fld">Hide referrer (tracking protection)<input type="checkbox" id="nr" ${set.noref?'checked':''}></div>
 <button class="btn red" id="c1">Clear history</button><button class="btn red" id="c2">Clear all browsing data</button>
 <p class="note">Pages render in the app’s own browser engine, so any site you can reach on the web will load here. Camera, microphone and location prompts are declined by default.</p>`);
 document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{set.theme=b.dataset.th;theme();save();settings()});
 $('#eng').onchange=e=>{set.engine=e.target.value;save()};
 $('#hp').onchange=e=>{const v=e.target.value.trim();if(!v){set.home=''}else{const u=norm(v);if(u&&u!=='ERR'&&u.indexOf(E[set.engine][1])!==0)set.home=u;else toast('Invalid homepage')}save()};
 $('#pop').onchange=e=>{set.popups=e.target.checked;save();if(BR)BR.setPopups(e.target.checked)};$('#nr').onchange=e=>{set.noref=e.target.checked;save()};
 $('#c1').onclick=()=>{hist=[];save();toast('History cleared')};
 $('#c2').onclick=()=>{hist=[];bm=[];fav=DF;const old=tabs;tabs=[mk()];curId=tabs[0].id;
 if(BR){old.forEach(x=>BR.close(String(x.id)));BR.blank(String(curId))}
 save();closeSheet();render();toast('All data cleared')};
 $('#sdone').onclick=closeSheet}

/* ---------- native bridge in ---------- */
window.BN={on:function(o){if(typeof o==='string'){try{o=JSON.parse(o)}catch(e){return}}
 if(o.id!=null&&o.id!==T().id){
   if(o.t==='visited'&&o.url){const t=tabs.find(x=>x.id===o.id);
     if(t){if(t.stack[t.i]!==o.url){t.stack=t.stack.slice(0,t.i+1);t.stack.push(o.url);t.i++}save()}}
   return}
 switch(o.t){
  case 'start':startLoad();break;
  case 'prog':setProg(o.p||0);break;
  case 'done':finish();break;
  case 'title':break;
  case 'visited':if(o.url)pushUrl(o.url,!!o.push);break;
  case 'error':showErr('Can’t load this page',(o.desc||'The site may be offline or blocking requests.'));break;
  case 'shot':toast(o.ok?(o.msg||'Screenshot saved'):'Couldn’t save screenshot');break;
  case 'back':hwback();break;
  case 'crash':toast('Page ran out of memory — reloading');recoverTab();break;
 }}};
window.BN.newTab=function(u){if(!u)return;var t=mk(T().priv);tabs.push(t);t.stack=[u];t.i=0;curId=t.id;save();if(BR)BR.newTab(String(t.id),u);render()};
function hwback(){
 if($('#sheet').classList.contains('on')){closeSheet();return}
 if($('#tabsv').classList.contains('on')){$('#tabsv').classList.remove('on');document.body.classList.remove('hidebar');render();return}
 if(sugOpen){url.blur();hideSug();return}
 if(!$('#err').hidden){$('#err').hidden=true;render();return}
 const t=T();
 if(t.i>0){t.i--;if(BR)BR.nav(String(t.id),t.stack[t.i]);render();return}
 if(BR)BR.exit();
}
theme();if(BR){BR.setPopups(set.popups);const t0=T();if(t0.stack[t0.i])BR.show(String(t0.id),t0.stack[t0.i])}render();
setInterval(()=>{if(!$('#home').hidden&&document.activeElement.id!=='hin')home()},60000);
addEventListener('pagehide',saveNow);
window.addEventListener('resize',()=>{lastChrome=-99;syncChrome()});
</script></body></html>
